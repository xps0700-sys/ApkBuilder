name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Extract Project
        run: |
          mkdir -p extracted_project
          unzip -q WhatsAppRecoveryPro-CLOUD-READY-v2.zip -d extracted_project
          echo "تم فك الضغط بنجاح. جاري استعراض الملفات..."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Smart Build APK
        run: |
          # البحث التلقائي عن مسار ملف gradlew
          GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "خطأ: لم يتم العثور على ملف gradlew داخل الملف المضغوط!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "تم العثور على المشروع في: $PROJECT_DIR"
          
          # الدخول للمسار الصحيح، إعطاء الصلاحيات، وبناء التطبيق
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Smart Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppRecoveryPro-APK
          # البحث التلقائي عن أي ملف APK تم إنشاؤه ورفعه
          path: extracted_project/**/*.apk
          
