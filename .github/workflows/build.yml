name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Gradle and Fix Project
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          mkdir -p my_project
          unzip -q WhatsAppRecoveryPro-CLOUD-READY-v2.zip -d my_project
          cd my_project
          gradle wrapper

      - name: Build APK
        working-directory: my_project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppRecoveryPro-APK
          path: my_project/app/build/outputs/apk/debug/*.apk
          
