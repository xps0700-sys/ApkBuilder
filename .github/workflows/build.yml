name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          mkdir my_project
          unzip WhatsAppRecoveryPro-CLOUD-READY-v2.zip -d my_project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Grant execute permission and fix line endings
        run: |
          chmod +x my_project/gradlew
          sed -i 's/\r$//' my_project/gradlew

      - name: Build APK
        working-directory: ./my_project
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-App-APK
          path: my_project/app/build/outputs/apk/debug/*.apk
