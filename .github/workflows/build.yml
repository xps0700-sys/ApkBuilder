name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Extract and Fix Line Endings
        run: |
          mkdir -p my_project
          unzip -q WhatsAppRecoveryPro-CLOUD-READY-v2.zip -d my_project
          sudo apt-get update && sudo apt-get install -y dos2unix
          find my_project -type f -exec dos2unix {} +
          chmod +x my_project/gradlew

      - name: Build APK
        working-directory: my_project
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppRecoveryPro-APK
          path: my_project/app/build/outputs/apk/debug/*.apk
