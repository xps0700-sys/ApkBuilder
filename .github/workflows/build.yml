name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Extract Project
        run: |
          mkdir -p my_project
          # فك الضغط عن المشروع
          unzip -q WhatsAppRecoveryPro-CLOUD-READY-v2.zip -d my_project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: my_project
        run: |
          # إعطاء صلاحية التشغيل لملف gradlew ثم البناء
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppRecoveryPro-APK
          path: my_project/app/build/outputs/apk/debug/*.apk
